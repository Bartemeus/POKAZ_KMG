<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMG Remote Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05080c;
      cursor: crosshair;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* Клик ловит родительский container */
    }
    #status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(11, 17, 24, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.offline { background: #ef4444; }
    .dot.connecting { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #64748b;
      z-index: 5;
      background: #070c12;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 210, 255, 0.1);
      border-top-color: #00d2ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .click-ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #00d2ff;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 1;
      pointer-events: none;
      animation: ripple 0.4s ease-out forwards;
      z-index: 100;
    }
    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(2.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div id="container">
  <div id="status-badge">
    <span class="dot connecting" id="status-dot"></span>
    <span id="status-text">Инициализация...</span>
  </div>

  <div id="placeholder">
    <div class="spinner"></div>
    <div id="placeholder-text">Ожидание трансляции...</div>
    <div id="host-config-bar" style="margin-top: 14px; display: flex; gap: 8px; pointer-events: auto; align-items: center; background: rgba(13, 21, 31, 0.85); padding: 8px 12px; border-radius: 8px; border: 1px solid #1a2736;">
      <span style="font-size: 11px; color: #7e91a5; text-transform: uppercase;">Хост:</span>
      <input type="text" id="host-ip-input" placeholder="10.122.149.90" style="background: #080d13; border: 1px solid #233446; color: #38bdf8; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 130px; font-family: monospace;">
      <button id="host-connect-btn" style="background: #00d2ff; color: #0b1118; border: none; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 11px; cursor: pointer;">OK</button>
    </div>
  </div>

  <video id="stream-video" autoplay playsinline muted></video>
  <img id="stream-fallback" alt="Live stream" style="width: 100%; height: 100%; object-fit: contain; display: none; pointer-events: none;">
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room') || 'kmg-stream-demo';
  const showBadge = params.get('badge') !== '0';

  const container = document.getElementById('container');
  const video = document.getElementById('stream-video');
  const statusBadge = document.getElementById('status-badge');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const placeholder = document.getElementById('placeholder');
  const placeholderText = document.getElementById('placeholder-text');
  const hostInput = document.getElementById('host-ip-input');
  const hostBtn = document.getElementById('host-connect-btn');

  let currentHost = params.get('server') || localStorage.getItem('kmg_remote_host') || 
                    (window.location.hostname && window.location.hostname !== 'localhost' ? window.location.hostname : '10.122.149.90');

  if (hostInput) {
    hostInput.value = currentHost;
    hostBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const newIp = hostInput.value.trim();
      if (newIp) {
        currentHost = newIp;
        localStorage.setItem('kmg_remote_host', newIp);
        initViewer();
      }
    });
    hostInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') hostBtn.click();
    });
    hostInput.addEventListener('click', (e) => e.stopPropagation());
  }

  if (!showBadge) {
    statusBadge.style.display = 'none';
  }

  const viewerId = 'viewer_' + Math.random().toString(36).substring(2, 8);
  let ws = null;
  let pc = null;
  let reconnectTimer = null;

  function updateStatus(state, text) {
    statusDot.className = 'dot ' + state;
    statusText.textContent = text;
    if (state === 'online') {
      placeholder.style.display = 'none';
    } else {
      placeholder.style.display = 'flex';
      placeholderText.textContent = text;
    }
  }

  function initViewer() {
    updateStatus('connecting', `Подключение к ${currentHost}:8765...`);

    const serverPort = params.get('port') || '8765';
    const wsUrl = `ws://${currentHost}:${serverPort}`;

    if (ws) {
      try { ws.close(); } catch(e) {}
    }

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      updateStatus('connecting', 'Ожидание видеопотока...');
      ws.send(JSON.stringify({
        type: 'register',
        role: 'viewer',
        room: roomId,
        viewer_id: viewerId
      }));
    };

    ws.onmessage = async (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      } catch (e) {
        console.error('Ошибка JSON:', e);
      }
    };

    ws.onclose = () => {
      updateStatus('offline', 'Хост недоступен, повтор...');
      closePeer();
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(initViewer, 2000);
    };

    ws.onerror = () => {
      updateStatus('offline', 'Ошибка подключения');
    };
  }

  async function handleServerMessage(msg) {
    if (msg.type === 'host_status') {
      if (!msg.online) {
        updateStatus('connecting', 'Хост приостановил трансляцию');
        closePeer();
      }
    } else if (msg.type === 'signal') {
      const signalData = msg.data;
      if (!signalData) return;

      if (signalData.sdp) {
        setupPeerConnection();
        if (signalData.sdp.type === 'offer') {
          await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          ws.send(JSON.stringify({
            type: 'signal',
            target: 'sender',
            room: roomId,
            data: { sdp: answer }
          }));
        } else if (signalData.sdp.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp));
        }
      } else if (signalData.candidate) {
        if (pc && pc.remoteDescription) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
          } catch(e) {
            console.warn('Ошибка добавления ICE кандидата:', e);
          }
        }
      }
    } else if (msg.type === 'frame') {
      if (webrtcActive) return; // WebRTC приоритетен
      const fallbackImg = document.getElementById('stream-fallback');
      if (fallbackImg) {
        fallbackImg.src = msg.data;
        fallbackImg.style.display = 'block';
        video.style.display = 'none';
        updateStatus('online', 'Трансляция активна');
      }
    }
  }

  let webrtcActive = false;

  function setupPeerConnection() {
    if (pc && pc.signalingState !== 'closed') {
      return pc;
    }
    closePeer();

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    });

    pc.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        webrtcActive = true;
        const fallbackImg = document.getElementById('stream-fallback');
        if (fallbackImg) fallbackImg.style.display = 'none';
        video.style.display = 'block';

        if (video.srcObject !== event.streams[0]) {
          video.srcObject = event.streams[0];
          video.play().catch(e => {
            if (e.name !== 'AbortError') console.warn('Play error:', e);
          });
        }
        updateStatus('online', 'Трансляция активна');
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'signal',
          target: 'sender',
          room: roomId,
          data: { candidate: event.candidate }
        }));
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        webrtcActive = true;
        updateStatus('online', 'Трансляция активна');
      } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        webrtcActive = false;
        updateStatus('connecting', 'Связь потеряна, ожидание...');
      }
    };
  }

  function closePeer() {
    webrtcActive = false;
    if (pc) {
      try { pc.close(); } catch(e) {}
      pc = null;
    }
    video.srcObject = null;
    const fallbackImg = document.getElementById('stream-fallback');
    if (fallbackImg) fallbackImg.style.display = 'none';
  }

  // Расчет нормализованных координат клика (0.0 - 1.0) с учетом object-fit: contain
  function getNormalizedCoordinates(e) {
    const fallbackImg = document.getElementById('stream-fallback');
    const isVideo = video.style.display !== 'none' && video.videoWidth > 0;
    const targetEl = isVideo ? video : fallbackImg;
    const rect = targetEl ? targetEl.getBoundingClientRect() : container.getBoundingClientRect();
    const vWidth = isVideo ? video.videoWidth : (fallbackImg.naturalWidth || 1920);
    const vHeight = isVideo ? video.videoHeight : (fallbackImg.naturalHeight || 1080);

    if (!vWidth || !vHeight) return null;

    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const containerRatio = rect.width / rect.height;
    const videoRatio = vWidth / vHeight;

    let renderWidth, renderHeight, offsetX = 0, offsetY = 0;

    if (containerRatio > videoRatio) {
      renderHeight = rect.height;
      renderWidth = rect.height * videoRatio;
      offsetX = (rect.width - renderWidth) / 2;
    } else {
      renderWidth = rect.width;
      renderHeight = renderWidth / videoRatio;
      offsetY = (rect.height - renderHeight) / 2;
    }

    const videoX = clickX - offsetX;
    const videoY = clickY - offsetY;

    if (videoX < 0 || videoX > renderWidth || videoY < 0 || videoY > renderHeight) {
      return null;
    }

    return {
      x: Math.max(0, Math.min(1, videoX / renderWidth)),
      y: Math.max(0, Math.min(1, videoY / renderHeight))
    };
  }

  function sendClick(e, button = 'left') {
    const coords = getNormalizedCoordinates(e);
    if (!coords) return;

    createRipple(e.clientX, e.clientY);

    const payload = {
      type: 'click',
      x: coords.x,
      y: coords.y,
      button: button,
      clicks: e.detail || 1
    };

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(payload));
    }
  }

  function createRipple(clientX, clientY) {
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = clientX + 'px';
    ripple.style.top = clientY + 'px';
    container.appendChild(ripple);
    setTimeout(() => ripple.remove(), 400);
  }

  container.addEventListener('click', (e) => {
    sendClick(e, 'left');
  });

  container.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    sendClick(e, 'right');
  });

  // Запуск
  initViewer();
</script>

</body>
</html>
